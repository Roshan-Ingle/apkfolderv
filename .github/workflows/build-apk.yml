name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_NAME: "Apkfolder"
  SAFE_APK_NAME: "Apkfolder"
  PKG_ID: "com.roshaningle.apkfolder"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and prepare Android project
        run: |
          set -e
          mkdir -p extracted
          unzip -q source.zip -d extracted
          rm -rf extracted/__MACOSX

          ITEMS=$(ls -A extracted | wc -l)
          if [ "$ITEMS" -eq 1 ]; then
            FIRST=$(ls -A extracted)
            if [ -d "extracted/$FIRST" ]; then
              SRC_DIR="extracted/$FIRST"
            else
              SRC_DIR="extracted"
            fi
          else
            SRC_DIR="extracted"
          fi

          mkdir -p android_build

          if [ -f "$SRC_DIR/build.gradle" ] || [ -f "$SRC_DIR/build.gradle.kts" ] || [ -f "$SRC_DIR/app/build.gradle" ] || [ -f "$SRC_DIR/app/build.gradle.kts" ]; then
            echo "Detected existing Android Gradle project."
            cp -a "$SRC_DIR/." android_build/
            rm -f android_build/local.properties
            python3 - << 'PYEOF'
          import os, re, html
          pkg = os.environ["PKG_ID"]
          app_name = html.escape(os.environ["APK_NAME"], quote=True).replace("'", "\\'")
          for gf in ["android_build/app/build.gradle", "android_build/app/build.gradle.kts"]:
            if os.path.exists(gf):
              txt = open(gf, "r", encoding="utf-8").read()
              txt = re.sub(r'(applicationId\s*=?\s*["\'])([^"\']+)(["\'])', r'\g<1>' + pkg + r'\g<3>', txt, count=1)
              open(gf, "w", encoding="utf-8").write(txt)
          sf = "android_build/app/src/main/res/values/strings.xml"
          if os.path.exists(sf):
            txt = open(sf, "r", encoding="utf-8").read()
            txt = re.sub(r'(<string\s+name="app_name"[^>]*>)(.*?)(</string>)', r'\g<1>' + app_name + r'\g<3>', txt, count=1)
            open(sf, "w", encoding="utf-8").write(txt)
          PYEOF
          else
            echo "Detected Web/Folder build. Wrapping inside AndroidX WebView project."
            PKG_PATH=$(echo "$PKG_ID" | tr '.' '/')
            mkdir -p "android_build/app/src/main/java/$PKG_PATH"
            mkdir -p "android_build/app/src/main/res/values"
            mkdir -p "android_build/app/src/main/res/drawable"
            mkdir -p "android_build/app/src/main/assets"

            cp -a "$SRC_DIR/." "android_build/app/src/main/assets/"

            cat << 'EOF' > android_build/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx2048m
          EOF

            cat << 'EOF' > android_build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ApkActionsApp"
          include ':app'
          EOF

            cat << 'EOF' > android_build/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

            cat << 'EOF' > android_build/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '__PKG_ID__'
              compileSdk 34
              defaultConfig {
                  applicationId "__PKG_ID__"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

            cat << 'EOF' > android_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

            if [ -f "android_build/app/src/main/assets/icon.png" ]; then
              cp "android_build/app/src/main/assets/icon.png" "android_build/app/src/main/res/drawable/ic_launcher.png"
            else
              cat << 'EOF' > android_build/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0D1117" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#238636" android:pathData="M54,22L82,38V70L54,86L26,70V38Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,40H60V56H68L54,71L40,56H48Z"/>
          </vector>
          EOF
            fi

            cat << 'EOF' > "android_build/app/src/main/java/$PKG_PATH/MainActivity.java"
          package __PKG_ID__;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

            python3 - << 'PYEOF'
          import os, html
          pkg = os.environ["PKG_ID"]
          app_name = html.escape(os.environ["APK_NAME"], quote=True).replace("'", "\\'")
          pkg_path = pkg.replace(".", "/")
          for p in [
            "android_build/app/build.gradle",
            f"android_build/app/src/main/java/{pkg_path}/MainActivity.java"
          ]:
            txt = open(p, "r", encoding="utf-8").read().replace("__PKG_ID__", pkg)
            open(p, "w", encoding="utf-8").write(txt)
          with open("android_build/app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
            f.write(f'<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">{app_name}</string>\n</resources>\n')
          PYEOF
          fi

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Debug APK
        working-directory: android_build
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Collect APK
        run: |
          APK_PATH=$(find android_build -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was generated!"
            exit 1
          fi
          mkdir -p output
          cp "$APK_PATH" "output/${SAFE_APK_NAME}.apk"
          ls -lh "output/${SAFE_APK_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_APK_NAME }}-apk
          path: output/*.apk

      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-build-${{ github.run_number }}-${{ github.run_id }}"
          gh release create "$TAG" "output/${SAFE_APK_NAME}.apk" \
            --title "${APK_NAME} (Build #${{ github.run_number }})" \
            --notes "Built automatically via APK Actions for **${APK_NAME}** (`${PKG_ID}`)."
